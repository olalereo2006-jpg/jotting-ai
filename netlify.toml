# Netlify config for Jotting AI
# firebase-admin is heavy and breaks under esbuild partial-bundling.
# Use the NFT bundler (default) so node_modules are resolved normally.
# If you switch back to esbuild, you MUST keep:
#   external_node_modules = ["firebase-admin"]

[build]
  # Adjust publish folder if your site builds to a different directory
  # publish = "dist"
  # command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

# SPA fallback + API route
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
