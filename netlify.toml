[build]
command = "npm run build"
publish = "build"
functions = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["firebase-admin"]

[build.environment]
CI = "false"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/manage-subscription"
  to = "/.netlify/functions/manage-subscription"
  status = 200



[functions."send-reminders"]
schedule ="@hourly"
